name: muslim_guide
description: "دليل المسلم — تطبيق Flutter إسلامي يعمل دون اتصال (Offline)."
publish_to: 'none'
# الإصدار يطابق جدول المراحل (phases/README.md — v0.1)
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  audio_service: 0.18.19
  audio_session: 0.2.4
  flutter:
    sdk: flutter
  flutter_compass: 0.8.1
  flutter_local_notifications: 22.3.1
  flutter_localizations:
    sdk: flutter
  # DEC-0002 + DEC-0016 — تحقق pub.dev 2026-10-05 (MIT): آخر إصدار 2.x ثابت
  flutter_riverpod: 2.6.1
  flutter_timezone: 5.1.1
  geolocator: 14.1.1
  go_router: 18.0.2
  # DEC-0033 + CR-0019 — تحقق pub.dev 2026-10-17 (BSD-2-Clause): Umm al-Qura مضمّن
  hijri: 3.0.1
  hive_ce: 2.20.2
  hive_ce_flutter: 2.4.0
  intl: 0.20.3
  just_audio: 0.10.6
  meta: 1.18.3
  path_provider: 2.1.6
  share_plus: 13.3.1
  timezone: 0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  geolocator_platform_interface: 4.4.0
  integration_test:
    sdk: flutter
  # DEC-0011 — تحقق pub.dev 2026-10-05 (MIT)
  very_good_analysis: 11.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/cities/
    - assets/audio/adhan.ogg
    - assets/content/quran/
  fonts:
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran.ttf
